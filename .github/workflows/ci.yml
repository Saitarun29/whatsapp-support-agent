name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in api/*.js assets/*.js scripts/*.mjs test/*.js; do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: Validate n8n workflow JSON
        run: |
          for f in n8n/*.json; do
            node -e "const w=JSON.parse(require('fs').readFileSync('$f','utf8')); if(!Array.isArray(w.nodes)||!w.connections) process.exit(1); console.log('$f ok,', w.nodes.length, 'nodes')"
          done
